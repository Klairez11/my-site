pacity:.45;cursor:not-allowed}.hero{background:#0b604b;color:white;border-radius:14px;padding:28px 32px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center}.hero:after{content:'✳';position:absolute;font-size:250px;color:#ffffff0b;right:26px;top:-105px}.hero p{color:#b9dbcb;max-width:560px;font-size:12px;margin-top:12px}.hero h2{font-size:24px}.hero .button{position:relative;z-index:1;background:#def1b7;color:#224e3b;border:0}.eyebrow{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:22px 0}.card{background:white;border:1px solid #e5ebe7;border-radius:12px;padding:23px}.stat label{color:#71877b;font-size:12px}.stat strong{display:block;font-size:29px;margin:10px 0 3px;font-weight:650}.stat small{font-size:10px;color:#8a9b90}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:20px;margin:20px 0}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{font-size:11px;color:#8a9a91}.dimension{display:grid;grid-template-columns:130px 1fr 65px;gap:12px;align-items:center;margin:22px 0;font-size:12px}.bar{height:8px;background:#edf2ee;border-radius:10px;overflow:hidden}.bar i{height:100%;display:block;background:#53a77e;border-radius:10px}.steps{border-left:2px solid #e7eee8;padding-left:20px}.steps div{margin:0 0 19px}.steps small{display:block;color:#8b9b92}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-weight:400;color:#809087;background:#f7f9f8}td,th{padding:16px 13px;border-bottom:1px solid #edf1ee;white-space:nowrap}td b{display:block;font-size:13px}td small{color:#8c9d92;font-size:10px}.link{color:#087a56;border:0;background:transparent;cursor:pointer;font:inherit;padding:0}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.filters input{min-width:250px}.notice{background:#f0f5ef;border:1px solid #dfe9df;padding:13px 17px;border-radius:8px;font-size:12px;color:#63816d;margin:18px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metrics .card{padding:18px}.metric-value{font-size:25px;font-weight:700;color:#157953}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label.field{display:flex;flex-direction:column;gap:6px;font-size:12px}input:focus,select:focus{outline:2px solid #89bda2}details{border-top:1px solid #edf1ee;padding:14px 0;font-size:12px}summary{cursor:pointer;font-weight:600}details p{margin:10px 0}.check{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 0}dialog{border:0;border-radius:14px;width:min(760px,95vw);max-height:90vh;padding:30px;box-shadow:0 20px 90px #12352b33}dialog::backdrop{background:#163b3266}.modal-head{display:flex;justify-content:space-between;margin-bottom:20px}footer{font-size:10px;color:#9ba99f;padding:16px 38px}#toast{position:fixed;bottom:30px;left:50%;background:#174f3b;color:#fff;padding:12px 22px;border-radius:9px;display:none;z-index:99}.empty{padding:35px;text-align:center;color:#81948a}.comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}a{color:#087a56}button:hover{filter:brightness(.96)}@media(max-width:1000px){aside{width:190px;padding:25px 15px}main{margin-left:190px}.grid{grid-template-columns:1fr}.stats,.metrics{grid-template-columns:repeat(2,1fr)}#app{padding:24px}header{padding:0 24px}}@media(max-width:650px){aside{position:relative;width:auto;padding:18px}.brand{font-size:23px}.space-label,.aside-bottom{display:none}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap;width:auto;padding:8px}.brand small{display:none}main{margin-left:0}header{height:60px;padding:10px;font-size:10px}#app{padding:18px}.hero{padding:22px;display:block}.hero .button{margin-top:10px}.page-head{align-items:flex-start;gap:12px}.page-head h1{font-size:22px}.stats{gap:10px}.card{padding:17px}.form-grid{grid-template-columns:1fr}.dimension{grid-template- </style></head><body><aside><a class="brand" href="#">✳ <span>织绿未来<small>GREEN DATA, REAL VALUE</small></span></a><div class="space-label">潮南印染 · 绿色协同空间</div><nav id="nav"></nav><div class="aside-bottom"><b>让每一份绿色努力<br>成为看得见的价值。</b><p>GreenID × GreenScore</p><span class="pill">● MVP 演示环境</span></div></aside><main><header><span>工作空间 <em>/</em> <span id="breadcrumb"></span></span><label>演示角色 <select id="role"><option value="buyer">采购方</option><option value="enterprise">企业填报员</option><option value="admin">平台管理员</option></select></label></header><div id="app"></div><footer>织绿未来 · 潮南印染集群绿色信用与碳数据价值化平台　｜　全部企业均为虚构样本 · 不构成认证或金融评级</footer></main><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
const KEY='zhilv-mvp-v1',RULE='GS-demo-1.0',names=['澄织染整（演示）','青禾纺织（演示）','新源印染（演示）','锦川染整（演示）'];
const seed=()=>({enterprises:names.map((name,i)=>({id:'CN-GID-'+String(i+1).padStart(4,'0'),name,period:'2026-09',product:['针织面料','梭织面料','针织面料','混纺面料'][i],output:1000+i*150,electricity:620000+i*190000,water:47000+i*14000,recycled:i===2?null:35000+i*6000,baseline:470+i*20,permit:i!==2,monitor:i===0||i===3,plan:i!==1,training:i===0,source:'企业自报（模拟）',shared:i!==2,files:[],version:1})),audit:[{at:'2026-10-24T08:00:00.000Z',actor:'系统',action:'初始化 4 家虚构企业样本',version:'种子数据 / '+RULE}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(db.enterprises)||!Array.isArray(db.audit))throw Error();}catch{db=seed()}
let page='overview',selected=db.enterprises[0].id,role='buyer',compare=new Set(),query='',product='',minComplete=0,onlyEvidence=false;
const pages={overview:['◫','工作台概览'],profiles:['▤','GreenID 企业档案'],entry:['⊕','企业数据填报'],procurement:['⇄','绿色采购匹配'],rules:['▧','评价方法与口径'],audit:['◷','版本与操作记录']};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v!==null&&v!==''&&Number.isFinite(Number(v)),fmt=(v,n=1)=>v===null?'待补充':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:n});
function evaluate(e){const fields=['period','product','output','electricity','water','recycled','baseline'];const complete=Math.round(fields.filter(k=>e[k]!==null&&e[k]!=='').length/fields.length*100);const carbon=num(e.electricity)?e.electricity*.5/1000:null;const intensity=num(e.output)&&e.output>0&&carbon!==null?carbon*1000/e.output:null;const wi=num(e.water)&&num(e.output)&&e.output>0?e.water/e.output:null;const reuse=num(e.water)&&num(e.recycled)&&e.water+e.recycled>0?e.recycled/(e.water+e.recycled)*100:null;const reduction=intensity!==null&&num(e.baseline)&&e.baseline>0?(e.baseline-intensity)/e.baseline*100:null;return {complete,carbon,intensity,wi,reuse,reduction,dimensions:[['能源与碳排放',intensity===null?'待补充':intensity<=400?'达到演示线':'关注改善'],['资源利用与循环',reuse===null||wi===null?'待补充':reuse>=40&&wi<=60?'达到演示线':'关注改善'],['环境治理与合规证据',e.permit&&e.monitor?'材料已声明':'待补充材料'],['绿色改进与管理',e.plan&&e.training?'材料已声明':'待补充材料']]}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('浏览器存储失败，请导出备份并释放空间。');return false}}
function record(action,e){db.audit.unshift({at:new Date().toISOString(),actor:{buyer:'采购方（演示）',enterprise:'企业填报员（演示）',admin:'管理员（演示）'}[role],action,version:e?e.id+' / v'+e.version+' / '+RULE:RULE,snapshot:e?JSON.parse(JSON.stringify(e)):undefined});persist()}
function go(p){page=p;render()}
function tag(s){return `<span class="tag ${/补充|关注/.test(s)?'amber':''}">${esc(s)}</span>`}
function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function heading(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function table(list,selectable=false){return `<div class="table-wrap"><table><thead><tr>${selectable?'<th>对比</th>':''}<th>企业 / GreenID</th><th>主营产品</th><th>数据完整度</th><th>碳强度¹</th><th>证据状态</th><th></th></tr></thead><tbody>${list.map(e=>{const v=evaluate(e);return `<tr>${selectable?`<td><input aria-label="对比 ${esc(e.name)}" type="checkbox" data-compare="${e.id}" ${compare.has(e.id)?'checked':''}></td>`:''}<td><b>${esc(e.name)}</b><small>${e.id} · v${e.version}</small></td><td>${esc(e.product)}</td><td>${v.complete}% <span class="muted">/ 自报</span></td><td>${fmt(v.intensity)} <small>kgCO₂e/t</small></td><td>${tag(e.permit&&e.monitor?'材料已声明':'待补充材料')}</td><td><button class="link" data-profile="${e.id}">查看档案 ↗</button></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">暂无符合条件的企业</td></tr>`}</tbody></table></div>`}
function overview(){const list=db.enterprises,avg=Math.round(list.reduce((s,e)=>s+evaluate(e).complete,0)/list.length);return heading('绿色数据，连接产业新价值','从企业绿色画像出发，让采购决策更透明、更有依据。',`<button class="button primary" data-go="procurement">进入采购工作台 ↗</button>`)+`<section class="hero"><div><div class="eyebrow">GREEN PROCUREMENT · FIRST</div><h2>让绿色表现成为供应链的共同语言</h2><p>以 GreenID 归集数据，以 GreenScore 呈现多维表现。优先服务绿色采购，逐步探索产业协同与数据价值。</p><span class="pill">四个评价维度 · 不设综合总分</span></div><button class="button" data-go="rules">了解评价方法 →</button></section><div class="stats"><div class="card stat"><label>GreenID 企业档案</label><strong>${list.length} <small>家</small></strong><small>全部为虚构演示企业</small></div><div class="card stat"><label>平均核心字段完整度</label><strong>${avg}<small> %</small></strong><small>完整不代表真实或已核验</small></div><div class="card stat"><label>已授权采购展示</label><strong>${list.filter(e=>e.shared).length} <small>家</small></strong><small>浏览器内演示授权</small></div><div class="card stat"><label>评价维度</label><strong>4 <small>项</small></strong><small>可解释 · 可追溯 · 无总分</small></div></div><div class="grid"><section class="card"><div class="card-title"><h2>集群数据准备情况</h2><span class="muted">演示样本 · 非园区实况</span></div>${['能源与碳排放','资源利用与循环','环境治理与合规证据','绿色改进与管理'].map((label,i)=>{const n=list.filter(e=>!evaluate(e).dimensions[i][1].includes('补充')).length;return `<div class="dimension"><span>${label}</span><div class="bar"><i style="width:${n/list.length*100}%"></i></div><span>${n} / ${list.length} 家</span></div>`}).join('')}<p class="muted">统计已填报或已声明状态，不代表第三方核验结论。</p></section><section class="card"><div class="card-title"><h2>三步开启绿色采购</h2><span class="tag">核心场景</span></div><div class="steps"><div><b>01　建立绿色档案</b><small>按月填报数据，关联来源材料</small></div><div><b>02　查看多维表现</b><small>展开计算口径，识别数据缺口</small></div><div><b>03　筛选并对比供应商</b><small>仅展示演示授权企业，不做排名背书</small></div></div></section></div><section class="card"><div class="card-title"><h2>企业绿色档案</h2><button class="link" data-go="profiles">查看全部 →</button></div>${table(role==='buyer'?list.filter(e=>e.shared):list)}</section>`}
function profile(e){const v=evaluate(e);return heading(esc(e.name),`${e.id} · 报告期 ${esc(e.period)} · v${e.version}`,`<button class="button" id="export-profile">导出档案</button>`)+`<div class="notice">${esc(e.source)} · 核心字段完整度 ${v.complete}% · 材料均待人工核验。GreenScore 为演示规则下的维度描述，不是绿色认证、信用评级或碳资产确权。</div><div class="metrics">${v.dimensions.map(([n,s])=>`<section class="card"><p>${n}</p>${tag(s)}</section>`).join('')}</div><div class="grid"><section class="card"><h2>数据与计算结果</h2><table><tbody>${[['产品',e.product],['产量',fmt(e.output)+' t'],['外购电量',fmt(e.electricity)+' kWh'],['新鲜水量',fmt(e.water)+' m³'],['回用水量',fmt(e.recycled)+' m³'],['电力相关排放估算',fmt(v.carbon)+' tCO₂e'],['单位产量电力排放',fmt(v.intensity)+' kgCO₂e/t'],['新鲜水强度',fmt(v.wi)+' m³/t'],['水回用率',fmt(v.reuse)+'%'],['相对自报基准改善',v.reduction===null?'待补充':fmt(v.reduction)+'%']].map(([a,b])=>`<tr><td>${a}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table><p class="muted">¹ 仅外购电力边界，不含蒸汽、燃料及其他范围；不等于企业完整碳盘查。</p></section><section class="card"><h2>来源与证据清单</h2><p>有材料 ≠ 已核验 ≠ 合规通过</p>${[['排污许可材料',e.permit],['监测报告材料',e.monitor],['绿色改进计划',e.plan],['管理培训记录',e.training]].map(([n,b])=>`<div class="card-title"><span>${n}</span>${tag(b?'企业声明持有':'待补充材料')}</div>`).join('')}<h3>已关联文件</h3>${e.files.map(f=>`<p>${esc(f.name)}<br><small>${fmt(f.size/1024)} KB · ${esc(f.category)} · 未核验<br>SHA-256: ${esc(f.hash||'未生成')}</small></p>`).join('')||'<p class="muted">尚无上传文件。演示证据声明来自样本数据。</p>'}<button class="link" data-go="rules">查看全部口径与阈值 →</button></section></div>`}
function entry(){if(role==='buyer')return heading('企业数据填报','采购方为只读角色')+'<div class="notice">请切换至“企业填报员”或“平台管理员”体验填报。此切换仅模拟视图，不提供安全鉴权。</div>';const e=db.enterprises.find(x=>x.id===selected)||db.enterprises[0];const fields=[['name','企业名称','text'],['period','报告期','month'],['product','主营产品','text'],['output','产量（t）','number'],['electricity','外购电量（kWh）','number'],['water','新鲜水量（m³）','number'],['recycled','回用水量（m³，可留空）','number'],['baseline','同边界自报基准（kgCO₂e/t，可留空）','number']];return heading('把绿色行动，沉淀为可信资料','填写月度数据并关联来源。保存后生成新版本，保留变更快照。')+`<div class="notice">本地演示：所有数据保存在当前浏览器。角色与授权均为交互占位；请勿上传真实敏感材料。OCR / NLP 尚未接入。</div><section class="card"><div class="card-title"><h2>月度数据填报</h2><select id="edit-select">${db.enterprises.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><form id="entry-form"><div class="form-grid">${fields.map(([k,n,t])=>`<label class="field">${n}<input name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':''} ${!['baseline','recycled'].includes(k)?'required':''} value="${esc(e[k])}" ${k==='name'?'maxlength="80"':''}></label>`).join('')}<label class="field">数据来源<select name="source"><option>企业自报（模拟）</option><option ${e.source==='企业自报（待核验）'?'selected':''}>企业自报（待核验）</option></select></label><label class="field">关联材料（PDF / 图片，单个不超过 2MB）<input type="file" id="files" multiple accept=".pdf,.png,.jpg,.jpeg"><small>仅记录文件名称、大小及 SHA-256；文件内容不会保存，未进行 OCR。</small></label></div><div style="margin:22px 0">${[['permit','声明持有排污许可材料'],['monitor','声明持有监测报告材料'],['plan','声明持有绿色改进计划'],['training','声明持有培训记录'],['shared','同意在本浏览器的采购视图展示档案（演示授权）']].map(([k,n])=>`<label class="check"><input type="checkbox" name="${k}" ${e[k]?'checked':''}>${n}</label>`).join('')}</div><button class="button primary" type="submit">保存并生成 v${e.version+1}</button> <span class="muted">当前 ${e.id} · v${e.version}</span></form></section>`}
function procurement(){const list=db.enterprises.filter(e=>e.shared&&e.name.includes(query)&&(!product||e.product===product)&&evaluate(e).complete>=minComplete&&(!onlyEvidence||e.permit&&e.monitor));return heading('发现更契合的绿色供应伙伴','以数据透明度和维度表现辅助初筛，不设企业综合排名。',`<button class="button primary" id="compare">对比已选（${compare.size}）</button>`)+`<div class="notice">仅展示已开启演示授权的企业。阈值为项目自定义演示值，未对标行业标准。采购前仍需人工核验材料与实际产能。</div><section class="card"><div class="filters"><input id="search" placeholder="搜索企业名称" value="${esc(query)}" aria-label="搜索企业名称"><select id="product"><option value="">全部产品类型</option>${['针织面料','梭织面料','混纺面料'].map(p=>`<option ${product===p?'selected':''}>${p}</option>`).join('')}</select><select id="complete"><option value="0">不限数据完整度</option><option value="100" ${minComplete===100?'selected':''}>核心字段完整度 100%</option></select><label class="check"><input id="evidence" type="checkbox" ${onlyEvidence?'checked':''}>已声明许可与监测材料</label></div>${table(list,true)}<p class="muted">匹配 ${list.length} 家 · 未授权企业不在此展示 · 排序按 GreenID 创建顺序</p></section>`}
function rules(){return heading('评价可以解释，数据才有意义','GreenScore · '+RULE+' · 项目自定义演示口径，不属于国家、行业或银行认可标准。')+`<div class="notice">坚持多维呈现，不合成总分。缺失值标记“待补充”，不按零分处理。声明、文件上传和真实核验是不同状态。</div><section class="card"><h2>计算口径与维度判定</h2>${[['能源与碳排放','电力相关排放（tCO₂e）= 电量（kWh）× 0.5 ÷ 1000；碳强度（kgCO₂e/t）= 电量 × 0.5 ÷ 产量。0.5 是演示假设因子，不是已核实的地区电网因子。强度 ≤ 400 显示“达到演示线”，否则“关注改善”。仅计算外购电力，不覆盖蒸汽、燃料和全生命周期。'],['资源利用与循环','新鲜水强度 = 新鲜水量 ÷ 产量；回用率 = 回用水量 ÷（新鲜水量 + 回用水量）× 100%。回用率 ≥ 40% 且新鲜水强度 ≤ 60 m³/t，显示“达到演示线”。这里是演示统计口径，回用水为期间回用流量，正式使用需统一计量边界并避免重复累计。'],['环境治理与合规证据','企业同时声明持有排污许可和监测报告，显示“材料已声明”；否则“待补充材料”。不判断许可证有效性、不自动认定达标或合规，上传文件也不会自动改变核验状态。'],['绿色改进与管理','同时声明持有绿色改进计划和培训记录，显示“材料已声明”。相对基准改善率 =（同边界自报基准 − 本期电力排放强度）÷ 基准 × 100%，仅作辅助展示，不参与维度判定。'],['完整度与缺失值','核心字段共 7 项：报告期、产品、产量、电量、新鲜水量、回用水量、同边界基准。完整度 = 非空字段数 ÷ 7；数值 0 为已填，缺失为 null。产量必须 > 0，分母为 0 时结果待补充。完整度不含材料核验，也不代表质量分数。'],['角色、授权与版本','采购方只读展示已授权档案；企业填报员在演示中可修改全部样本；管理员可新建档案。角色切换没有账号认证或服务器权限。每次保存形成版本快照，浏览器记录可被本机修改，不是不可篡改审计账本。']].map(([n,t])=>`<details open><summary>${n}</summary><p>${t}</p></details>`).join('')}</section><div class="grid"><section class="card"><h2>本阶段已实现</h2><p>企业档案、数据填报、文件摘要、缺失提示、多维评价、授权展示、筛选对比、版本快照和 JSON 导出。全部使用虚构样本。</p></section><section class="card"><h2>后续阶段</h2><p>第二阶段：账号、服务端权限、数据库与材料存储、人工审核。第三阶段：真实数据口径校准、成熟 OCR 辅助录入；融资支持与园区管理按试点需求另行验证。未接入外部接口、区块链、金融机构或真实客户。</p></section></div>`}
function audit(){return heading('每次更新，都留下来处','本机浏览器操作记录 · 可查看保存时的完整数据快照',`<button class="button" id="export-all">导出本地备份</button>`)+`<div class="notice">版本记录用于演示追溯，未接入独立审计存储，不具备防篡改保证。附件仅保留元数据。</div><section class="card"><table><thead><tr><th>时间</th><th>角色</th><th>操作 / 版本</th><th>快照</th></tr></thead><tbody>${db.audit.map((a,i)=>`<tr><td>${esc(new Date(a.at).toLocaleString('zh-CN'))}</td><td>${esc(a.actor)}</td><td><b>${esc(a.action)}</b><small>${esc(a.version)}</small></td><td>${a.snapshot?`<button class="link" data-snapshot="${i}">查看</button>`:'—'}</td></tr>`).join('')}</tbody></table></section>`}
function render(){ $('#nav').innerHTML=Object.entries(pages).map(([k,[icon,n]])=>`<button data-go="${k}" class="${page===k?'active':''}">${icon}　${n}</button>`).join('');$('#breadcrumb').textContent=pages[page][1];$('#app').innerHTML=page==='overview'?overview():page==='profiles'?heading('一企一档，绿色表现清晰可见','GreenID 归集档案 · GreenScore 呈现维度表现',role==='admin'?'<button class="button primary" id="new">＋ 新建企业</button>':'')+`<section class="card">${table(role==='buyer'?db.enterprises.filter(e=>e.shared):db.enterprises)}</section>`:page==='entry'?entry():page==='procurement'?procurement():page==='rules'?rules():audit();bind()}
function open(html){$('#modal').innerHTML=`<div class="modal-head"><span class="muted">GREENID · 数据透明</span><button class="button" id="close-modal">关闭 ×</button></div>`+html;$('#close-modal').onclick=()=>$('#modal').close();$('#modal').showModal()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{const e=db.enterprises.find(e=>e.id===b.dataset.profile);if(role==='buyer'&&!e.shared)return;open(profile(e));$('#export-profile').onclick=()=>download(e.id+'.json',{enterprise:e,evaluation:evaluate(e),ruleVersion:RULE,disclaimer:'演示自报数据，未核验'});$('#modal [data-go]').onclick=()=>{$('#modal').close();go('rules')}});document.querySelectorAll('[data-compare]').forEach(b=>b.onchange=()=>{if(b.checked&&compare.size>=3){b.checked=false;return toast('最多对比 3 家企业')}b.checked?compare.add(b.dataset.compare):compare.delete(b.dataset.compare);$('#compare').textContent=`对比已选（${compare.size}）`});if($('#search')){$('#search').onchange=e=>{query=e.target.value;render()};$('#product').onchange=e=>{product=e.target.value;render()};$('#complete').onchange=e=>{minComplete=Number(e.target.value);render()};$('#evidence').onchange=e=>{onlyEvidence=e.target.checked;render()};$('#compare').onclick=()=>{const list=db.enterprises.filter(e=>compare.has(e.id)&&e.shared);if(list.length<2)return toast('请至少选择 2 家企业进行对比');open('<h2>供应商维度对比</h2><p>同为月度演示数据，请结合产品和生产边界审慎比较。</p><div class="comparison">'+list.map(e=>{const v=evaluate(e);return `<section class="card"><h3>${esc(e.name)}</h3><p>${esc(e.product)} · ${esc(e.period)}</p>${v.dimensions.map(([n,s])=>`<p>${n}<br>${tag(s)}</p>`).join('')}<p>核心字段完整度 ${v.complete}%<br>碳强度 ${fmt(v.intensity)} kgCO₂e/t<br>新鲜水强度 ${fmt(v.wi)} m³/t<br>水回用率 ${fmt(v.reuse)}%</p></section>`}).join('')+'</div>')}}if($('#edit-select'))$('#edit-select').onchange=e=>{selected=e.target.value;render()};if($('#entry-form'))$('#entry-form').onsubmit=saveEntry;if($('#new'))$('#new').onclick=()=>{const id='CN-GID-'+crypto.randomUUID().slice(0,8);const e={id,name:'新建企业（演示）',period:'2026-09',product:'针织面料',output:null,electricity:null,water:null,recycled:null,baseline:null,permit:false,monitor:false,plan:false,training:false,shared:false,source:'企业自报（待核验）',files:[],version:1};db.enterprises.push(e);record('新建企业档案',e);selected=id;go('entry')};if($('#export-all'))$('#export-all').onclick=()=>download('织绿未来-本地备份.json',{...db,ruleVersion:RULE});document.querySelectorAll('[data-snapshot]').forEach(b=>b.onclick=()=>{const a=db.audit[Number(b.dataset.snapshot)];open(`<h2>保存时快照</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(a.snapshot,null,2))}</pre>`)})}
async function saveEntry(event){event.preventDefault();if(role==='buyer')return;const form=event.target,button=form.querySelector('button[type=submit]');button.disabled=true;try{const data=new FormData(form),old=db.enterprises.find(e=>e.id===selected),e=JSON.parse(JSON.stringify(old));for(const k of ['name','period','product','source'])e[k]=String(data.get(k)).trim();for(const k of ['output','electricity','water','recycled','baseline']){const raw=data.get(k);e[k]=raw===''?null:Number(raw);if(e[k]!==null&&(!Number.isFinite(e[k])||e[k]<0))throw Error('数值必须为非负有限数')}if(!e.name||!e.product||!e.period)throw Error('请补全企业名称、产品与报告期');if(!(e.output>0))throw Error('产量必须大于 0');if(e.baseline!==null&&e.baseline<=0)throw Error('基准必须大于 0 或留空');for(const k of ['permit','monitor','plan','training','shared'])e[k]=data.has(k);const files=[...$('#files').files];if(e.files.length+files.length>20)throw Error('每家企业最多关联 20 个文件');for(const f of files){if(f.size>2*1024*1024)throw Error('单个文件不得超过 2MB');if(!/\.(pdf|png|jpe?g)$/i.test(f.name))throw Error('仅支持 PDF、PNG、JPG 材料');const buffer=await f.arrayBuffer(),hash=crypto.subtle?Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),x=>x.toString(16).padStart(2,'0')).join(''):null;e.files.push({name:f.name,size:f.size,category:'待人工分类',hash,at:new Date().toISOString()})}e.version++;const previous=JSON.parse(JSON.stringify(db));db.enterprises=db.enterprises.map(x=>x.id===e.id?e:x);db.audit.unshift({at:new Date().toISOString(),actor:role==='admin'?'管理员（演示）':'企业填报员（演示）',action:'保存企业填报；材料待核验',version:e.id+' / v'+e.version+' / '+RULE,snapshot:e});if(!persist()){db=previous;return}toast('已保存新版本；评价已重新计算');render()}catch(error){toast(error.message)}finally{button.disabled=false}}
$('#role').onchange=e=>{role=e.target.value;compare.clear();render();toast('已切换演示视图；未启用真实身份认证')};render();

</script></body></html>
